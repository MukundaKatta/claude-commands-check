name: "claude-commands-check"
description: "Lint Claude Code slash-command files (.claude/commands/*.md). Validates frontmatter, tools, model, and flags secrets."
author: "Mukunda Katta"

branding:
  icon: "terminal"
  color: "green"

inputs:
  paths:
    description: "Paths or directories to scan for command files. Multiple space-separated values allowed."
    required: false
    default: ".claude/commands"
  quiet:
    description: "Only print errors (hide OK lines and warnings)."
    required: false
    default: "false"
  python-version:
    description: "Python version to set up for the action."
    required: false
    default: "3.12"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install claude-commands-check
      shell: bash
      run: pip install --quiet claude-commands-check

    - name: Run claude-commands-check
      shell: bash
      run: |
        args=""
        if [ "${{ inputs.quiet }}" = "true" ]; then
          args="--quiet"
        fi
        claude-commands-check $args ${{ inputs.paths }}
